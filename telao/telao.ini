; Configurações do telão
; Não remover os [grupos]
[CONFIG]
cod_telao = 1
; Timer longo, responsável por carregar as mensagens e configurações do telao após a inicialização.
timer_config_ms = 29000

[WEBSVC]
ws_telao = 127.0.0.1:8080/telao
ws_config = 127.0.0.1:8080/telao-config
ws_mensagem = 127.0.0.1:8080/mensagem

ws_password =

; cor definida como 0xRGB   Exemplo: 0xFA09CA  Red: 0xFA  Green: 0x09  Blue: 0xCA
[COLOURS]
colour_background = 0x000000
colour_font = 0xFFFFFF
colour_rect = 0xFFFFFF
